<!DOCTYPE html>
<html>

<head>
    <title>Contact Me - Ishrar Islam</title>
    <link rel="stylesheet" href="../CSS/contactme.css">
</head>

<body>
    <h2 class="header">Contact Me</h2>

    <nav>
        <a href="../index.html">Home</a>
        <a href="./education.html">Education</a>
        <a href="./experience.html">Experience</a>
        <a href="./projects.html">Projects</a>
    </nav>

    <div class="form-wrapper">
        <form method="GET">
            <div class="form-row">
                <label for="firstname">First Name :</label>
                <div class="field">
                    <input type="text" id="firstname" name="firstname" required>
                </div>
            </div>


            <div class="form-row">
                <label for="lastname">Last Name :</label>
                <div class="field">
                    <input type="text" id="lastname" name="lastname" required>
                </div>
            </div>

            <div class="form-row">
                <label for="email">Email :</label>
                <div class="field">
                    <input type="email" id="email" name="email" required>
                </div>
            </div>

            <div class="form-row">
                <label>Reason To Contact :</label>
                <div class="field-options">
                    <label><input type="radio" name="reason" value="project" required> Project</label>
                    <label><input type="radio" name="reason" value="thesis"> Thesis</label>
                    <label><input type="radio" name="reason" value="job"> Job</label>
                </div>
            </div>


            <div class="form-row">
                <label>Services I Provide :</label>
                <div class="field-options">
                    <input type="checkbox" name="services" value="dl"><label>Deep Learning </label>
                    <input type="checkbox" name="services" value="ds"><label>Data Science </label>
                    <input type="checkbox" name="services" value="nlp"><label>Natural Language Processing </label>
                </div>
            </div>


            <div class="form-row">
                <label for="date">Select a Date :</label>
                <div class="field">
                    <input type="date" id="date" name="date" required>
                </div>
            </div>


            <div class="button-row">
                <input type="submit" value="Book Appointment">
                <input type="reset" value="Reset">
            </div>
        </form>
    </div>
</body>

</html>
